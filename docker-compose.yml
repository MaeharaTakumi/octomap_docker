# docker run -itd --ipc=host --gpus=all --env="NVIDIA_DRIVER_CAPABILITIES=all" --net host --privileged \
#   -e DISPLAY=unix${DISPLAY} -e NVIDIA_VISIBLE_DEVICES=0 -v /tmp/.X11-unix:/tmp/.X11-unix \
#   -v $(pwd)/config:/root/octomap/config \
#   --name octomap octomap_maehara:latest
# と同じ設定（localization の docker-compose.yml と同じ）
name: octomap_maehara
services:
  octomap:
    build:
      context: .
    image: octomap_maehara:latest
    container_name: octomap
    stdin_open: true
    tty: true
    ipc: host
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=unix${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # launch・パラメータ・RViz の設定はホストの config/ を使う（ホストで直せば、起動し直すだけで反映される）
      - ./config:/root/octomap/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
